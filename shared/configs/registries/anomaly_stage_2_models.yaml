claude_compatible_stage_2:
  stage: anomaly_stage_2
  adapter: claude_compatible_stage_2
  artifact_ref: external_claude_compatible_api
  runtime:
    provider: claude_compatible
    backend: http
    prompt_mode: external-json
    fallback_on_failure: false
  capabilities:
    prompt_support: true
    runtime_targets:
      - http
      - localhost
    tasks:
      - PERSON
      - BAG
    source_kinds:
      - camera_url
      - video_upload
      - webcam
  requires_gpu: false
  resource_profile:
    cpu_cores: 1
  ui:
    provider_settings:
      summary_label: Claude-compatible profile
      actions:
        configure:
          label: Configure
          aria_label: Configure Claude-Compatible Model
          help: Open endpoint, model, timeout, and token settings for this Claude-compatible anomaly model.
        test_connection:
          label: Test
          busy_label: Testing...
          aria_label: Test Claude-Compatible Connection
          help: Send a lightweight request to verify the Claude-compatible anomaly endpoint and token.
        save:
          label: Save LLM
          busy_label: Saving...
          aria_label: Save Claude-Compatible Anomaly LLM Model
          help: Save encrypted Claude-compatible provider settings for anomaly detection.
        cancel:
          label: Cancel
          aria_label: Cancel Claude-Compatible Settings
          help: Close without saving Claude-compatible provider setting changes.
      fields:
        base_url:
          label: Base URL
          placeholder: https://provider.example/v1
          help: Claude-compatible anomaly API base URL.
        model_name:
          label: Model Name
          placeholder: claude-compatible-model
          help: Model name sent to the Claude-compatible anomaly endpoint.
        timeout_seconds:
          label: Timeout
          help: Request timeout in seconds for Claude-compatible anomaly calls.
        auth_token:
          label: Auth Token
          placeholder: Claude-compatible auth token
          help: Encrypted token used only server-side for Claude-compatible requests.

